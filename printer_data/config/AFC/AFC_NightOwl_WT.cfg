# When using different hardware use config below as template
# Adapt pins in config file
[include mcu/ERB_2.0_WT.cfg]

[mcu NightOwl_WT]
canbus_uuid: 7044b5bc8e14
canbus_interface: can1

[temperature_sensor NightOwl_WT-ERB]
sensor_type: temperature_mcu
sensor_mcu: NightOwl_WT

[AFC_NightOwl NightOwl_WT]
hub: NightOwl_WT_Hub
extruder: extruder
buffer: TN_WT

[AFC_stepper lane1_wt]
unit: NightOwl_WT:1
extruder: extruder
step_pin: NightOwl_WT:LANE1_STEP
dir_pin: NightOwl_WT:LANE1_DIR
enable_pin: !NightOwl_WT:LANE1_EN
microsteps: 16
rotation_distance: 4.65
dist_hub: 45.0
park_dist: 10
load: ^!NightOwl_WT:LANE1_TRIG
prep: ^!NightOwl_WT:LANE1_EXT

[tmc2209 AFC_stepper lane1_wt]
uart_pin: NightOwl_WT:LANE1_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_stepper lane2_wt]
unit: NightOwl_WT:2
extruder: extruder
step_pin: NightOwl_WT:LANE2_STEP
dir_pin: !NightOwl_WT:LANE2_DIR
enable_pin: !NightOwl_WT:LANE2_EN
microsteps: 16
rotation_distance: 4.65
dist_hub: 45.0
park_dist: 10
load: ^!NightOwl_WT:LANE2_TRIG
prep: ^!NightOwl_WT:LANE2_EXT

[tmc2209 AFC_stepper lane2_wt]
uart_pin: NightOwl_WT:LANE2_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_hub NightOwl_WT_Hub]
afc_bowden_length: 1690.032
move_dis: 50
cut: False                  # Hub has Cutter
#--=================================================================================--#
######### Hub Cut #####################################################################
#--=================================================================================--#
cut_cmd: AFC                #CMD to use
cut_dist: 200               # How much filament to cut off (in mm).
cut_clear: 120              # How far the filament should retract back from the hub (in mm).
cut_min_length: 300.0
cut_servo_pass_angle: 10    # Servo angle to align the Bowden tube with the hole for loading the toolhead.
cut_servo_clip_angle: 180   # Servo angle for cutting the filament.
cut_servo_prep_angle: 80    # Servo angle to prepare the filament for cutting (aligning the exit hole).
switch_pin: ^NightOwl_WT:NT_HUB