# NightOwl WT - Single Lane Direct Feed

[include mcu/ERB_2.0_WT.cfg]

[mcu NightOwl_WT]
canbus_uuid: 7044b5bc8e14
canbus_interface: can1

[temperature_sensor NightOwl_WT-ERB]
sensor_type: temperature_mcu
sensor_mcu: NightOwl_WT

[AFC_NightOwl NightOwl_WT]
extruder: extruder

[AFC_stepper lane1_wt]
unit: NightOwl_WT:1
extruder: extruder
hub: direct
map: T0

step_pin: NightOwl_WT:LANE1_STEP
dir_pin: NightOwl_WT:LANE1_DIR
enable_pin: !NightOwl_WT:LANE1_EN
microsteps: 16
rotation_distance: 4.65

dist_hub: 780.0
park_dist: 10
capture_td1_when_loaded: False

load: ^!NightOwl_WT:LANE1_TRIG
prep: ^!NightOwl_WT:LANE1_EXT

[tmc2209 AFC_stepper lane1_wt]
uart_pin: NightOwl_WT:LANE1_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110