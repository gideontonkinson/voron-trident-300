[board_pins NightOwl_WT_pins]
#fysetc erb2.0
mcu: NightOwl_WT # Assuming using an external / extra mcu dedicated to MMU
aliases:
    LANE1_UART=gpio17,
    LANE1_STEP=gpio16,
    LANE1_DIR=gpio15,
    LANE1_EN=gpio14,
    LANE1_DIAG=gpio19,
    LANE1_ENDSTOP=gpio24,
    LANE2_UART=gpio11,
    LANE2_STEP=gpio10,
    LANE2_DIR=gpio9,
    LANE2_EN=gpio8,
    LANE2_DIAG=gpio13,
    MMU_SERVO=gpio23,
    MMU_ENCODER=gpio22,
    MMU_GATE_SENSOR=,
    MMU_NEOPIXEL=gpio21,
    LANE1_TRIG=gpio4,
    LANE2_TRIG=gpio6,
    LANE1_EXT=gpio3,
    LANE2_EXT=gpio5,
    NT_HUB=gpio12,
    TN_ADV=gpio18,
    TN_TRL=gpio2,
    # The following pins are all ADC pins on the ERB 2.0 board for the PSF sensor
    # gpio26, gpio 27, gpio28, gpio29
    PSF=gpio26