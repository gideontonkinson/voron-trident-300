# When using different hardware use config below as template
# Adapt pins in config file
[include mcu/ERB_2.0_BT.cfg]

[mcu NightOwl_BT]
canbus_uuid: b783f79e48ac
canbus_interface: can1

[temperature_sensor NightOwl_BT-ERB]
sensor_type: temperature_mcu
sensor_mcu: NightOwl_BT

[AFC_NightOwl NightOwl_BT]
hub: NightOwl_BT_Hub
extruder: extruder
buffer: TN_BT

[AFC_stepper lane1_bt]
unit: NightOwl_BT:1
extruder: extruder
step_pin: NightOwl_BT:LANE1_STEP
dir_pin: NightOwl_BT:LANE1_DIR
enable_pin: !NightOwl_BT:LANE1_EN
microsteps: 16
rotation_distance: 4.65
dist_hub: 45.0
park_dist: 10
load: ^!NightOwl_BT:LANE1_TRIG
prep: ^!NightOwl_BT:LANE1_EXT

[tmc2209 AFC_stepper lane1_bt]
uart_pin: NightOwl_BT:LANE1_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_stepper lane2_bt]
unit: NightOwl_BT:2
extruder: extruder
step_pin: NightOwl_BT:LANE2_STEP
dir_pin: !NightOwl_BT:LANE2_DIR
enable_pin: !NightOwl_BT:LANE2_EN
microsteps: 16
rotation_distance: 4.65
dist_hub: 45.0
park_dist: 10
load: ^!NightOwl_BT:LANE2_TRIG
prep: ^!NightOwl_BT:LANE2_EXT

[tmc2209 AFC_stepper lane2_bt]
uart_pin: NightOwl_BT:LANE2_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_hub NightOwl_BY_Hub]
switch_pin: ^!NightOwl_BT:HUB
afc_bowden_length: 1690.032
move_dis: 50
move_dis: 50                # Distance to move the filament within the hub in mm.
cut: False                  # Hub has Cutter
#--=================================================================================--#
######### Hub Cut #####################################################################
#--=================================================================================--#
cut_cmd: AFC                #CMD to use
cut_dist: 200               # How much filament to cut off (in mm).
cut_clear: 120              # How far the filament should retract back from the hub (in mm).
cut_min_length: 300.0
cut_servo_pass_angle: 10    # Servo angle to align the Bowden tube with the hole for loading the toolhead.
cut_servo_clip_angle: 180   # Servo angle for cutting the filament.
cut_servo_prep_angle: 80    # Servo angle to prepare the filament for cutting (aligning the exit hole).
switch_pin: ^!NightOwl_BT:NT_HUB