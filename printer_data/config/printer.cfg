[include fluidd.cfg]
[include toolhead.cfg]
[include eddy.cfg]
[include bed.cfg]
[include autotune_tmc.cfg]
[include KAMP_Settings.cfg]
[exclude_object]

[force_move]
enable_force_move: true

[mcu]
canbus_uuid: 772583ad2d2d

[temperature_sensor cb1]
sensor_type: temperature_host
min_temp: 0
max_temp: 85

[temperature_sensor manta_ez_e3]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 85

[temperature_fan electronics_fan_1]
pin: PB14
sensor_type: temperature_host
control: watermark
target_temp: 60
min_temp: 0
max_temp: 85
max_speed: 1.0
min_speed: 0.0
kick_start_time: 0.5
off_below: 0.10

[temperature_fan electronics_fan_2]
pin: PB15
sensor_type: temperature_host
control: watermark
target_temp: 60
min_temp: 0
max_temp: 85
max_speed: 1.0
min_speed: 0.0
kick_start_time: 0.5
off_below: 0.10

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 15
max_z_accel: 350

# ============================================================
# Voron Trident 300 - Manta E3EZ v1.0 motion baseline
# A/B motors are on E0/E1.
# Z motors are on X/Y/Z.
# ============================================================

# B motor on Manta E1
[stepper_x]
step_pin: PB7
dir_pin: !PB6
enable_pin: !PB4
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200

endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: 0
position_endstop: 300
position_max: 300

homing_speed: 60
homing_retract_dist: 0
homing_positive_dir: true

# A motor on Manta E0
[stepper_y]
step_pin: PD5
dir_pin: !PD6
enable_pin: !PB3
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200

endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: 0
position_endstop: 300
position_max: 300

homing_speed: 60
homing_retract_dist: 0
homing_positive_dir: true

# Z0 on Manta X
[stepper_z]
step_pin: PA14
dir_pin: !PA10
enable_pin: !PA13
microsteps: 16
rotation_distance: 8
full_steps_per_rotation: 200

# Temporary until Eddy is configured:
# Do not home Z yet.
endstop_pin: ^PC4
position_endstop: 0
position_min: -5
position_max: 260
homing_speed: 8

# Z1 on Manta Y
[stepper_z1]
step_pin: PC8
dir_pin: PA15
enable_pin: !PC14
microsteps: 16
rotation_distance: 8
full_steps_per_rotation: 200

# Z2 on Manta Z
[stepper_z2]
step_pin: PD2
dir_pin: PD4
enable_pin: !PD3
microsteps: 16
rotation_distance: 8
full_steps_per_rotation: 200

# ============================================================
# EZ2209 drivers
# ============================================================

# E1 driver - B motor / stepper_x
[tmc2209 stepper_x]
uart_pin: PB5
diag_pin: ^PB1
run_current: 0.90
sense_resistor: 0.110
stealthchop_threshold: 0
driver_SGTHRS: 100

# E0 driver - A motor / stepper_y
[tmc2209 stepper_y]
uart_pin: PD1
diag_pin: ^PC5
run_current: 0.90
sense_resistor: 0.110
stealthchop_threshold: 0
driver_SGTHRS: 100

# X driver - Z0
[tmc2209 stepper_z]
uart_pin: PB8
run_current: 0.65
sense_resistor: 0.110
stealthchop_threshold: 999999

# Y driver - Z1
[tmc2209 stepper_z1]
uart_pin: PC9
run_current: 0.65
sense_resistor: 0.110
stealthchop_threshold: 999999

# Z driver - Z2
[tmc2209 stepper_z2]
uart_pin: PD0
run_current: 0.65
sense_resistor: 0.110
stealthchop_threshold: 999999