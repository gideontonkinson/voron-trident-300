[fan_generic bed_circulation]
pin: PA8
kick_start_time: 0.5
max_power: .3

[thermistor chamber_10k_b3435]
temperature1: 25
resistance1: 10000
temperature2: 50
resistance2: 4100
temperature3: 100
resistance3: 680

[temperature_sensor chamber]
sensor_type: chamber_10k_b3435
sensor_pin: PA4
min_temp: 0
max_temp: 100

[heater_bed]
heater_pin: PB2
sensor_type: Generic 3950
sensor_pin: PA3
control: pid
pwm_cycle_time: 0.3
pid_Kp=57.496
pid_Ki=2.738
pid_Kd=301.854
min_temp: 0
max_temp: 120

[z_tilt]
z_positions:
    -50, 18
    150, 348
    350, 18
points:
    10, 0
    150, 260
    290, 0

speed: 200
horizontal_move_z: 2
retries: 10
retry_tolerance: 0.005

[gcode_macro Z_TILT_ADJUST]
rename_existing: _Z_TILT_ADJUST
description: EddyNG tap before Z tilt, then perform rough and fine Z tilt
gcode:
    SAVE_GCODE_STATE NAME=STATE_Z_TILT
    BED_MESH_CLEAR
    G90
    # Move to a safe center-ish tap location.
    # Make sure both nozzle and Eddy coil are over the bed here.
    G1 X150 Y154 Z5 F6000
    # EddyNG tap / contact reference
    PROBE_EDDY_NG_TAP
    {% if not printer.z_tilt.applied %}
        _Z_TILT_ADJUST HORIZONTAL_MOVE_Z=8 RETRY_TOLERANCE=1
    {% endif %}
    _Z_TILT_ADJUST HORIZONTAL_MOVE_Z=2
    RESTORE_GCODE_STATE NAME=STATE_Z_TILT

[bed_mesh]
speed: 200
horizontal_move_z: 2
mesh_min: 10, 30
mesh_max: 290, 280
probe_count: 20, 20
algorithm: bicubic