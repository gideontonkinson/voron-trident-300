#####################################################################
#   Cartographer V4 CAN
#####################################################################

[mcu cartographer]
canbus_uuid: YOUR_CARTOGRAPHER_UUID
# restart_method: command
# Not needed for CAN probes according to Cartographer docs.

[cartographer]
mcu: cartographer

# Probe offsets are from nozzle tip to CENTER of Cartographer coil.
# Keep x_offset 0 only if your mount really puts the coil center inline with nozzle X.
x_offset: 0

# Your Eddy was y_offset: 27.53.
# Re-measure this for the Cartographer mount. Do not blindly reuse it
# unless the Cartographer coil center is in the exact same spot.
y_offset: 27.53

verbose: no

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105