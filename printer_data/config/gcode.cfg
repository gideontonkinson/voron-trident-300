[gcode_macro HOME_X]
gcode:
    G28 X
    G91
    G1 X-10 F1600
    G90

[gcode_macro HOME_Y]
gcode:
    G28 Y
    G91
    G1 Y-10 F1600
    G90

[gcode_macro LINE_PURGE]
description: A purge macro that adapts to be near your actual printed objects
gcode:
    # Get relevant printer params
    {% set travel_speed = (printer.toolhead.max_velocity) * 60 | float %}
    {% set cross_section = printer.configfile.settings.extruder.max_extrude_cross_section | float %}
    
    # Use firmware retraction if it is defined
    {% if printer.firmware_retraction is defined %}
        {% set RETRACT = G10 | string %}
        {% set UNRETRACT = G11 | string %}
    {% else %}
        {% set RETRACT = 'G1 E-.5 F2100' | string %}
        {% set UNRETRACT = 'G1 E.5 F2100' | string %}
    {% endif %}

    # Get purge settings from _Kamp_Settings
    {% set verbose_enable = printer["gcode_macro _KAMP_Settings"].verbose_enable | abs %}
    {% set purge_height = printer["gcode_macro _KAMP_Settings"].purge_height | float %}
    {% set tip_distance = printer["gcode_macro _KAMP_Settings"].tip_distance | float %}
    {% set purge_margin = printer["gcode_macro _KAMP_Settings"].purge_margin | float %}
    {% set purge_amount = printer["gcode_macro _KAMP_Settings"].purge_amount | float %}
    {% set flow_rate = printer["gcode_macro _KAMP_Settings"].flow_rate | float %}


    # Calculate purge origins and centers from objects
    {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}    # Get all object points
    {% set purge_x_min = (all_points | map(attribute=0) | min | default(0)) %}                          # Object x min
    {% set purge_x_max = (all_points | map(attribute=0) | max | default(0)) %}                          # Object x max
    {% set purge_y_min = (all_points | map(attribute=1) | min | default(0)) %}                          # Object y min
    {% set purge_y_max = (all_points | map(attribute=1) | max | default(0)) %}                          # Object y max

    {% set purge_x_center = ([((purge_x_max + purge_x_min) / 2) - (purge_amount / 2), 0] | max) %}      # Create center point of purge line relative to print on X axis
    {% set purge_y_center = ([((purge_y_max + purge_y_min) / 2) - (purge_amount / 2), 0] | max) %}      # Create center point of purge line relative to print on Y axis

    {% set purge_x_origin = ([purge_x_min - purge_margin, 0] | max) %}                                  # Add margin to x min, compare to 0, and choose the larger
    {% set purge_y_origin = ([purge_y_min - purge_margin, 0] | max) %}                                  # Add margin to y min, compare to 0, and choose the larger

    # Calculate purge speed
    {% set purge_move_speed = (flow_rate / 5.0) * 60 | float %}

    {% if cross_section < 5 %}

        {action_respond_info("[Extruder] max_extrude_cross_section is insufficient for purge, please set it to 5 or greater. Purge skipped.")}

    {% else %}

        {% if verbose_enable == True %}

        {action_respond_info("Moving filament tip {}mms".format(                                                                 
            (tip_distance),                                                                                      
        )) }
        {% endif %}

        {% if printer.firmware_retraction is defined %}
            {action_respond_info("KAMP purge is using firmware retraction.")}
        {% else %}
            {action_respond_info("KAMP purge is not using firmware retraction, it is recommended to configure it.")}
        {% endif %}

        {% if purge_y_origin > 0 %}
        
            {action_respond_info("KAMP purge starting at {}, {} and purging {}mm of filament, requested flow rate is {}mm3/s.".format(                                                                 
                (purge_x_center),
                (purge_y_origin),
                (purge_amount),
                (flow_rate),
            )) }
    
        {% else %}
    
            {action_respond_info("KAMP purge starting at {}, {} and purging {}mm of filament, requested flow rate is {}mm3/s.".format(                                                                 
                (purge_x_origin),
                (purge_y_center),
                (purge_amount),
                (flow_rate),
            )) }

        {% endif %}

        SAVE_GCODE_STATE NAME=Prepurge_State                                                    # Create gcode state

        {% if purge_y_origin > 0 %}                                                             # If there's room on Y, purge along X axis in front of print area

            G92 E0                                                                              # Reset extruder
            G0 F{travel_speed}                                                                  # Set travel speed
            G90                                                                                 # Absolute positioning
            G0 X{purge_x_center} Y{purge_y_origin}                                              # Move to purge position
            G0 Z{purge_height}                                                                  # Move to purge Z height
            M83                                                                                 # Relative extrusion mode
            G1 E{tip_distance} F{purge_move_speed}                                              # Move filament tip
            G1 X{purge_x_center + purge_amount} E{purge_amount} F{purge_move_speed}             # Purge line
            {RETRACT}                                                                           # Retract
            G0 X{purge_x_center + purge_amount + 10} F{travel_speed}                            # Rapid move to break string
            G92 E0                                                                              # Reset extruder distance
            M82                                                                                 # Absolute extrusion mode
            G0 Z{purge_height * 2} F{travel_speed}                                              # Z hop

        {% else %}                                                                              # If there's room on X, purge along Y axis to the left of print area
            
            G92 E0                                                                              # Reset extruder
            G0 F{travel_speed}                                                                  # Set travel speed
            G90                                                                                 # Absolute positioning
            G0 X{purge_x_origin} Y{purge_y_center}                                              # Move to purge position
            G0 Z{purge_height}                                                                  # Move to purge Z height
            M83                                                                                 # Relative extrusion mode
            G1 E{tip_distance} F{purge_move_speed}                                              # Move filament tip
            G1 Y{purge_y_center + purge_amount} E{purge_amount} F{purge_move_speed}             # Purge line
            {RETRACT}                                                                           # Retract
            G0 Y{purge_y_center + purge_amount + 10} F{travel_speed}                            # Rapid move to break string
            G92 E0                                                                              # Reset extruder distance
            M82                                                                                 # Absolute extrusion mode
            G0 Z{purge_height * 2} F{travel_speed}                                              # Z hop

        {% endif %}

        RESTORE_GCODE_STATE NAME=Prepurge_State                                                 # Restore gcode state
    
    {% endif %}


#####################################################################
# Start Print
#####################################################################
[gcode_macro PRINT_START]
description: Start print with bed heat, Z tilt, Cartographer touch home, adaptive mesh, and purge
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(params.BED|default(60))|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(params.EXTRUDER|default(210))|float %}
    {% set CHAMBER_TEMP = params.CHAMBER_TEMP|default(params.CHAMBER|default(0))|float %}
    
    M117 Reset Z offset
    SET_GCODE_OFFSET Z=0 ; Reset Z offset

    M117 Homing
    G28
    G90
    
    M117 Cartographer Touch Home 
    CARTOGRAPHER_TOUCH_HOME 

    M117 Heating bed
    M140 S{BED_TEMP}

    # Keep nozzle at 150C or below for Cartographer probing
    M104 S150

    # Run bed circulation fan while heating/soaking
    SET_FAN_SPEED FAN=bed_circulation SPEED=1.0

    M190 S{BED_TEMP}

    {% if CHAMBER_TEMP > 0 %}
        CHAMBER_FAN_CONTROL TARGET={CHAMBER_TEMP} HOT_SPEED=1.0 HOLD_SPEED=0.25
        M117 Waiting for chamber
        TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={CHAMBER_TEMP}
        SET_FAN_SPEED FAN=bed_circulation SPEED=0.25
    {% else %}
        SET_FAN_SPEED FAN=bed_circulation SPEED=0.25
    {% endif %}

    M117 Z tilt
    Z_TILT_ADJUST  

    M117 Cartographer Touch Home 
    CARTOGRAPHER_TOUCH_HOME 

    # Now build the adaptive mesh
    M117 Adaptive bed mesh
    BED_MESH_CALIBRATE ADAPTIVE=1

    # Move somewhere safe while nozzle heats
    SMART_PARK

    M117 Heating nozzle
    M109 S{EXTRUDER_TEMP}

    M117 Purging
    LINE_PURGE

    M117 Printing

#####################################################################
# End Print
#####################################################################

[gcode_macro PRINT_END]
description: End print, retract, park toolhead, lower bed if possible, and shut down heaters
gcode:
    {% set park_x = params.X|default(300)|float %}
    {% set park_y = params.Y|default(300)|float %}
    {% set z_drop = params.Z_DROP|default(50)|float %}

    {% set max_x = printer.toolhead.axis_maximum.x|float %}
    {% set max_y = printer.toolhead.axis_maximum.y|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set cur_z = printer.toolhead.position.z|float %}

    # Clamp park position to machine limits
    {% set park_x = [park_x, max_x]|min %}
    {% set park_y = [park_y, max_y]|min %}

    # Lower bed by Z_DROP if possible, otherwise go to max Z
    {% set target_z = [cur_z + z_drop, max_z]|min %}

    M117 Print ending

    # Turn off heaters
    M104 S0
    M140 S0

    # Turn off part cooling fan and bed fan
    M107
    CHAMBER_FAN_CONTROL TARGET=0

    # Small retract if hot enough
    {% if printer.extruder.temperature >= 180 %}
        G92 E0
        G1 E-5 F1800
    {% endif %}

    # Move Z up / bed down, then park XY
    {% if "xyz" in printer.toolhead.homed_axes %}
        G90
        G1 Z{target_z} F600
        G1 X{park_x} Y{park_y} F6000
    {% else %}
        M117 Not homed, skipping park move
    {% endif %}

    # Disable steppers except Z so the bed does not drop
    M84 X Y E

    BED_MESH_CLEAR

    M117 Print complete

#####################################################################
# Cancel Print
#####################################################################
[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
description: Cancel the print and run the normal print-end cleanup
gcode:
    M117 Cancelling print...

    # Run your normal end routine
    PRINT_END

    # Clear pause state if currently paused
    CLEAR_PAUSE

    # Tell Klipper / Moonraker / Mainsail / Fluidd the print is cancelled
    CANCEL_PRINT_BASE

#####################################################################
# Pause
#####################################################################
[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
description: Pause print, retract, z-hop, and park
variable_retract: 1.5
variable_z_hop: 10
variable_park_x: 10
variable_park_y: 10
variable_extrude_temp_min: 180
gcode:
    {% set retract = params.RETRACT|default(printer["gcode_macro PAUSE"].retract)|float %}
    {% set z_hop = params.Z_HOP|default(printer["gcode_macro PAUSE"].z_hop)|float %}
    {% set park_x = params.X|default(printer["gcode_macro PAUSE"].park_x)|float %}
    {% set park_y = params.Y|default(printer["gcode_macro PAUSE"].park_y)|float %}
    {% set min_temp = printer["gcode_macro PAUSE"].extrude_temp_min|float %}

    M117 Pausing...

    # Call original Klipper pause
    PAUSE_BASE

    # Save current position / mode
    SAVE_GCODE_STATE NAME=PAUSE_STATE

    # Retract only if hot enough
    {% if printer.extruder.temperature >= min_temp %}
        G91
        G1 E-{retract} F1800
    {% endif %}

    # Z-hop only if Z is homed
    {% if "z" in printer.toolhead.homed_axes %}
        G91
        G1 Z{z_hop} F3000
    {% endif %}

    # Park only if XY are homed
    {% if "x" in printer.toolhead.homed_axes and "y" in printer.toolhead.homed_axes %}
        G90
        G1 X{park_x} Y{park_y} F9000
    {% endif %}

    RESTORE_GCODE_STATE NAME=PAUSE_STATE

    M117 Print paused

#####################################################################
# Resume
#####################################################################
[gcode_macro RESUME]
rename_existing: RESUME_BASE
description: Resume print and unretract
variable_retract: 1.5
variable_extrude_temp_min: 180
gcode:
    {% set retract = params.RETRACT|default(printer["gcode_macro RESUME"].retract)|float %}
    {% set min_temp = printer["gcode_macro RESUME"].extrude_temp_min|float %}

    M117 Resuming...

    SAVE_GCODE_STATE NAME=RESUME_STATE

    # Unretract only if hot enough
    {% if printer.extruder.temperature >= min_temp %}
        G91
        G1 E{retract} F1800
    {% endif %}

    RESTORE_GCODE_STATE NAME=RESUME_STATE

    # Call original Klipper resume
    RESUME_BASE

    M117 Printing

[gcode_macro Z_TILT_ADJUST]
rename_existing: _Z_TILT_ADJUST
description: Perform rough and fine Z tilt
gcode:
    SAVE_GCODE_STATE NAME=STATE_Z_TILT
    BED_MESH_CLEAR
    G90

    {% if not printer.z_tilt.applied %}
        _Z_TILT_ADJUST HORIZONTAL_MOVE_Z=8 RETRY_TOLERANCE=1
    {% endif %}

    _Z_TILT_ADJUST HORIZONTAL_MOVE_Z=2

    RESTORE_GCODE_STATE NAME=STATE_Z_TILT

