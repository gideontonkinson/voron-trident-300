#####################################################################
# Start Print
#####################################################################
[gcode_macro PRINT_START]
description: Start print macro with KAMP, Eddy scan mesh, Z tilt, and adaptive purge
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|float %}
    {% set CHAMBER_TEMP = params.CHAMBER_TEMP|default(0)|float %}

    M117 Heating bed
    M140 S{BED_TEMP}
    M104 S150

    # Wait for bed
    M190 S{BED_TEMP}

    # Optional chamber wait if you have a chamber temp sensor named "chamber"
    {% if CHAMBER_TEMP > 0 %}
        M117 Waiting for chamber
        TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={CHAMBER_TEMP}
    {% endif %}

    M117 Homing
    G28

    M117 Z tilt
    Z_TILT_ADJUST
    G28 Z

    M117 Heating nozzle
    M104 S{EXTRUDER_TEMP}

    # Clear old mesh before making a fresh adaptive one
    BED_MESH_CLEAR

    M117 Adaptive bed mesh
    BED_MESH_CALIBRATE METHOD=rapid_scan ADAPTIVE=1

    # Move somewhere safe while nozzle finishes heating
    SMART_PARK

    M117 Waiting for nozzle
    M109 S{EXTRUDER_TEMP}

    M117 Purging
    LINE_PURGE

    M117 Printing

#####################################################################
# End Print
#####################################################################

[gcode_macro PRINT_END]
description: End print, retract, park toolhead, lower bed if possible, and shut down heaters
gcode:
    {% set park_x = params.X|default(300)|float %}
    {% set park_y = params.Y|default(300)|float %}
    {% set z_drop = params.Z_DROP|default(50)|float %}

    {% set max_x = printer.toolhead.axis_maximum.x|float %}
    {% set max_y = printer.toolhead.axis_maximum.y|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set cur_z = printer.toolhead.position.z|float %}

    # Clamp park position to machine limits
    {% set park_x = [park_x, max_x]|min %}
    {% set park_y = [park_y, max_y]|min %}

    # Lower bed by Z_DROP if possible, otherwise go to max Z
    {% set target_z = [cur_z + z_drop, max_z]|min %}

    M117 Print ending

    # Turn off heaters
    M104 S0
    M140 S0

    # Turn off part cooling fan
    M107

    # Small retract if hot enough
    {% if printer.extruder.temperature >= 180 %}
        G92 E0
        G1 E-2 F1800
    {% endif %}

    # Move Z up / bed down, then park XY
    {% if "xyz" in printer.toolhead.homed_axes %}
        G90
        G1 Z{target_z} F600
        G1 X{park_x} Y{park_y} F6000
    {% else %}
        M117 Not homed, skipping park move
    {% endif %}

    # Disable steppers except Z so the bed does not drop
    M84 X Y E

    BED_MESH_CLEAR

    M117 Print complete

#####################################################################
# Cancel Print
#####################################################################
[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
description: Cancel the print and run the normal print-end cleanup
gcode:
    M117 Cancelling print...

    # Run your normal end routine
    PRINT_END

    # Clear pause state if currently paused
    CLEAR_PAUSE

    # Tell Klipper / Moonraker / Mainsail / Fluidd the print is cancelled
    CANCEL_PRINT_BASE

#####################################################################
# Pause
#####################################################################
[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
description: Pause print, retract, z-hop, and park
variable_retract: 1.5
variable_z_hop: 10
variable_park_x: 10
variable_park_y: 10
variable_extrude_temp_min: 180
gcode:
    {% set retract = params.RETRACT|default(printer["gcode_macro PAUSE"].retract)|float %}
    {% set z_hop = params.Z_HOP|default(printer["gcode_macro PAUSE"].z_hop)|float %}
    {% set park_x = params.X|default(printer["gcode_macro PAUSE"].park_x)|float %}
    {% set park_y = params.Y|default(printer["gcode_macro PAUSE"].park_y)|float %}
    {% set min_temp = printer["gcode_macro PAUSE"].extrude_temp_min|float %}

    M117 Pausing...

    # Call original Klipper pause
    PAUSE_BASE

    # Save current position / mode
    SAVE_GCODE_STATE NAME=PAUSE_STATE

    # Retract only if hot enough
    {% if printer.extruder.temperature >= min_temp %}
        G91
        G1 E-{retract} F1800
    {% endif %}

    # Z-hop only if Z is homed
    {% if "z" in printer.toolhead.homed_axes %}
        G91
        G1 Z{z_hop} F3000
    {% endif %}

    # Park only if XY are homed
    {% if "x" in printer.toolhead.homed_axes and "y" in printer.toolhead.homed_axes %}
        G90
        G1 X{park_x} Y{park_y} F9000
    {% endif %}

    RESTORE_GCODE_STATE NAME=PAUSE_STATE

    M117 Print paused

#####################################################################
# Resume
#####################################################################
[gcode_macro RESUME]
rename_existing: RESUME_BASE
description: Resume print and unretract
variable_retract: 1.5
variable_extrude_temp_min: 180
gcode:
    {% set retract = params.RETRACT|default(printer["gcode_macro RESUME"].retract)|float %}
    {% set min_temp = printer["gcode_macro RESUME"].extrude_temp_min|float %}

    M117 Resuming...

    SAVE_GCODE_STATE NAME=RESUME_STATE

    # Unretract only if hot enough
    {% if printer.extruder.temperature >= min_temp %}
        G91
        G1 E{retract} F1800
    {% endif %}

    RESTORE_GCODE_STATE NAME=RESUME_STATE

    # Call original Klipper resume
    RESUME_BASE

    M117 Printing

[gcode_macro Z_TILT_ADJUST]
rename_existing: _Z_TILT_ADJUST
description: EddyNG tap before Z tilt, then perform rough and fine Z tilt
gcode:
    SAVE_GCODE_STATE NAME=STATE_Z_TILT
    BED_MESH_CLEAR
    G90
    G1 X150 Y154 Z5 F6000
    PROBE_EDDY_NG_TAP
    {% if not printer.z_tilt.applied %}
        _Z_TILT_ADJUST HORIZONTAL_MOVE_Z=8 RETRY_TOLERANCE=1
    {% endif %}
    _Z_TILT_ADJUST HORIZONTAL_MOVE_Z=2
    G1 X150 Y154 Z5 F6000
    RESTORE_GCODE_STATE NAME=STATE_Z_TILT

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_BASE
description: EddyNG tap, then always run bed mesh in Eddy rapid scan mode by default
gcode:
    SAVE_GCODE_STATE NAME=STATE_BED_MESH_CALIBRATE
    BED_MESH_CLEAR
    G90
    G1 X150 Y154 Z5 F6000
    PROBE_EDDY_NG_TAP
    BED_MESH_CALIBRATE_BASE METHOD=rapid_scan {rawparams}
    G1 X150 Y154 Z5 F6000
    RESTORE_GCODE_STATE NAME=STATE_BED_MESH_CALIBRATE

[gcode_macro TOOLHEAD_LEDS_ON]
[gcode_macro TOOLHEAD_LEDS_ON]
description: Turn on only toolhead LEDs 1 and 2
gcode:
    SET_LED LED=toolhead_leds INDEX=1 RED=1 GREEN=1 BLUE=1 TRANSMIT=0
    SET_LED LED=toolhead_leds INDEX=2 RED=1 GREEN=1 BLUE=1 TRANSMIT=0
    SET_LED LED=toolhead_leds INDEX=3 RED=0.15 GREEN=0.15 BLUE=0.15 TRANSMIT=1

[gcode_macro TOOLHEAD_LEDS_OFF]
description: Turn all toolhead LEDs off
gcode:
    SET_LED LED=toolhead_leds RED=0 GREEN=0 BLUE=0

[gcode_macro TOOLHEAD_LEDS_DIM]
description: Set toolhead LEDs dim
gcode:
    SET_LED LED=toolhead_leds INDEX=1 RED=0.05 GREEN=0.05 BLUE=0.05 TRANSMIT=0
    SET_LED LED=toolhead_leds INDEX=2 RED=0.05 GREEN=0.05 BLUE=0.05 TRANSMIT=0
    SET_LED LED=toolhead_leds INDEX=3 RED=0.05 GREEN=0.05 BLUE=0.05 TRANSMIT=1

[gcode_macro TOOLHEAD_LOGO_OFF]
description: Turn off only toolhead LED 3
gcode:
    SET_LED LED=toolhead_leds INDEX=3 RED=0 GREEN=0 BLUE=0

[gcode_macro TOOLHEAD_LOGO_ON]
description: Turn off only toolhead LED 3
gcode:
    SET_LED LED=toolhead_leds INDEX=3 RED=0.15 GREEN=0.15 BLUE=0.15

[gcode_macro TOOLHEAD_LOGO_DIM]
description: Turn off only toolhead LED 3
gcode:
    SET_LED LED=toolhead_leds INDEX=3 RED=0.05 GREEN=0.05 BLUE=0.05