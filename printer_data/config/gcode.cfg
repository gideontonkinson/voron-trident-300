[gcode_macro TOOLHEAD_LEDS_ON]
[gcode_macro TOOLHEAD_LEDS_ON]
description: Turn on only toolhead LEDs 1 and 2
gcode:
    SET_LED LED=toolhead_leds INDEX=1 RED=1 GREEN=1 BLUE=1 TRANSMIT=0
    SET_LED LED=toolhead_leds INDEX=2 RED=1 GREEN=1 BLUE=1 TRANSMIT=0
    SET_LED LED=toolhead_leds INDEX=3 RED=0.15 GREEN=0.15 BLUE=0.15 TRANSMIT=1

[gcode_macro TOOLHEAD_LEDS_OFF]
description: Turn all toolhead LEDs off
gcode:
    SET_LED LED=toolhead_leds RED=0 GREEN=0 BLUE=0

[gcode_macro TOOLHEAD_LEDS_DIM]
description: Set toolhead LEDs dim
gcode:
    SET_LED LED=toolhead_leds INDEX=1 RED=0.05 GREEN=0.05 BLUE=0.05 TRANSMIT=0
    SET_LED LED=toolhead_leds INDEX=2 RED=0.05 GREEN=0.05 BLUE=0.05 TRANSMIT=0
    SET_LED LED=toolhead_leds INDEX=3 RED=0.05 GREEN=0.05 BLUE=0.05 TRANSMIT=1

[gcode_macro TOOLHEAD_LOGO_OFF]
description: Turn off only toolhead LED 3
gcode:
    SET_LED LED=toolhead_leds INDEX=3 RED=0 GREEN=0 BLUE=0

[gcode_macro TOOLHEAD_LOGO_ON]
description: Turn off only toolhead LED 3
gcode:
    SET_LED LED=toolhead_leds INDEX=3 RED=0.15 GREEN=0.15 BLUE=0.15

[gcode_macro TOOLHEAD_LOGO_DIM]
description: Turn off only toolhead LED 3
gcode:
    SET_LED LED=toolhead_leds INDEX=3 RED=0.05 GREEN=0.05 BLUE=0.05