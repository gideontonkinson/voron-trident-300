[gcode_macro HOME_X]
gcode:
    G28 X
    G91
    G1 X-10 F1600
    G90

[gcode_macro HOME_Y]
gcode:
    G28 Y
    G91
    G1 Y-10 F1600
    G90

#####################################################################
# Start Print
#####################################################################
[gcode_macro PRINT_START]
description: Start print with bed heat, Z tilt, Cartographer touch home, adaptive mesh, and purge
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(params.BED|default(60))|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(params.EXTRUDER|default(210))|float %}  
    {% set CHAMBER_TARGET = params.CHAMBER_TARGET|default(params.CHAMBER|default(0))|float %}
    {% set CHAMBER_MIN = params.CHAMBER_MIN|default(0)|float %}
    
    M117 Reset Z offset
    SET_GCODE_OFFSET Z=0

    M117 Homing
    G28
    G90

    M117 Heating bed
    M140 S{BED_TEMP}

    SET_FAN_SPEED FAN=bed_circulation SPEED=1.0

    M190 S{BED_TEMP}

    {% if CHAMBER_TARGET > 0 %}

        CHAMBER_FAN_CONTROL TARGET={CHAMBER_TARGET} HOT_SPEED=1.0 HOLD_SPEED=0.25

        {% if CHAMBER_MIN > 0 %}
            M117 Waiting for chamber
            TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={CHAMBER_MIN}
        {% endif %}

        SET_FAN_SPEED FAN=bed_circulation SPEED=0.25

    {% else %}

        SET_FAN_SPEED FAN=bed_circulation SPEED=0.25

    {% endif %}

    M117 Z Tilt
    Z_TILT_ADJUST

    M117 Heating for cleaning
    M109 S150

    M117 Cleaning nozzle
    CLEAN_NOZZLE

    M117 Cartographer Touch Home
    M109 S150
    G28 Z
    CARTOGRAPHER_TOUCH_HOME

    M117 Adaptive Bed Mesh
    BED_MESH_CALIBRATE ADAPTIVE=1

    SMART_PARK

    M117 Heating nozzle
    M109 S{EXTRUDER_TEMP}

    M117 Purging
    LINE_PURGE

    M117 Printing

#####################################################################
# End Print
#####################################################################

[gcode_macro PRINT_END]
description: End print, retract, clean/park nozzle, shut down heaters, and leave Z motors energized

gcode:
    {% set z_drop = params.Z_DROP|default(50)|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set cur_z = printer.toolhead.position.z|float %}

    # Lower bed by Z_DROP if possible, otherwise go to max Z
    {% set target_z = [cur_z + z_drop, max_z]|min %}

    M117 Print ending

    # Turn off part cooling fan and chamber fan
    M107
    CHAMBER_FAN_CONTROL TARGET=0

    # Small retract if hot enough
    {% if printer.extruder.temperature >= 180 %}
        G92 E0
        G1 E-5 F1800
    {% endif %}

    # Move bed down and park nozzle if homed
    {% if "xyz" in printer.toolhead.homed_axes %}
        G90

        # Raise nozzle / lower bed if possible
        {% if target_z > cur_z %}
            G1 Z{target_z} F3000
        {% endif %}

        # Clean and park nozzle, then leave hotend off
        PARK_NOZZLE SET_TEMP=0

    {% else %}
        M117 Not homed, skipping park move
    {% endif %}

    # Turn off all heaters AFTER parking/cleaning
    TURN_OFF_HEATERS

    BED_MESH_CLEAR

    M84

    M117 Print complete


#####################################################################
# Cancel Print
#####################################################################
[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
description: Cancel the print and run the normal print-end cleanup
gcode:
    M117 Cancelling print...

    # Run your normal end routine
    PRINT_END

    # Clear pause state if currently paused
    CLEAR_PAUSE

    # Tell Klipper / Moonraker / Mainsail / Fluidd the print is cancelled
    CANCEL_PRINT_BASE

#####################################################################
# Pause
#####################################################################
[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
description: Pause print, retract, Z-hop, and park without cleaning

variable_retract: 1.5
variable_z_hop: 10
variable_extrude_temp_min: 180
variable_saved_extruder_target: 0

gcode:
    {% set retract = params.RETRACT|default(printer["gcode_macro PAUSE"].retract)|float %}
    {% set z_hop = params.Z_HOP|default(printer["gcode_macro PAUSE"].z_hop)|float %}
    {% set min_temp = printer["gcode_macro PAUSE"].extrude_temp_min|float %}

    # Save the active print temperature target
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=saved_extruder_target VALUE={printer.extruder.target|float}

    M117 Pausing...

    # Call original Klipper pause
    PAUSE_BASE

    SAVE_GCODE_STATE NAME=PAUSE_STATE

    # Retract only if hot enough
    {% if printer.extruder.temperature >= min_temp %}
        G91
        G1 E-{retract} F1800
    {% endif %}

    # Z-hop only if Z is homed and there is room
    {% if "z" in printer.toolhead.homed_axes %}
        {% set current_z = printer.toolhead.position.z|float %}
        {% set max_z = printer.toolhead.axis_maximum.z|float %}
        {% set hop = [z_hop, max_z - current_z]|min %}

        {% if hop > 0 %}
            G91
            G1 Z{hop} F3000
        {% endif %}
    {% endif %}

    # Park only if XY are homed
    {% if "x" in printer.toolhead.homed_axes and "y" in printer.toolhead.homed_axes %}
        G90
        G1 X{printer["gcode_macro CLEAN_NOZZLE"].park_x} Y{printer["gcode_macro CLEAN_NOZZLE"].park_y} F18000
    {% endif %}

    RESTORE_GCODE_STATE NAME=PAUSE_STATE

    # Put nozzle into standby temperature while paused
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=150

    M117 Print paused


#####################################################################
# Resume
#####################################################################
[gcode_macro RESUME]
rename_existing: RESUME_BASE
description: Restore nozzle temperature, unretract, and resume

variable_retract: 1.5
variable_extrude_temp_min: 180

gcode:
    {% set retract = params.RETRACT|default(printer["gcode_macro RESUME"].retract)|float %}
    {% set min_temp = printer["gcode_macro RESUME"].extrude_temp_min|float %}
    {% set saved_target = printer["gcode_macro PAUSE"].saved_extruder_target|float %}

    M117 Restoring nozzle temperature

    # Restore the original print temperature
    {% if saved_target > 0 %}
        M109 S{saved_target}
    {% endif %}

    SAVE_GCODE_STATE NAME=RESUME_STATE

    # Only unretract once hot enough
    {% if printer.extruder.temperature >= min_temp %}
        G91
        G1 E{retract} F1800
    {% endif %}

    RESTORE_GCODE_STATE NAME=RESUME_STATE

    M117 Resuming...

    # Call original Klipper resume
    RESUME_BASE

    M117 Printing


[gcode_macro Z_TILT_ADJUST]
rename_existing: _Z_TILT_ADJUST
description: Perform rough and fine Z tilt
gcode:
    SAVE_GCODE_STATE NAME=STATE_Z_TILT
    BED_MESH_CLEAR
    G90

    {% if not printer.z_tilt.applied %}
        _Z_TILT_ADJUST HORIZONTAL_MOVE_Z=8 RETRY_TOLERANCE=1
    {% endif %}

    _Z_TILT_ADJUST HORIZONTAL_MOVE_Z=2

    RESTORE_GCODE_STATE NAME=STATE_Z_TILT

[gcode_macro TOOLHEAD_LEDS_ON]
description: Turn on only toolhead LEDs 1 and 2
gcode:
    SET_LED LED=toolhead_leds INDEX=1 RED=1 GREEN=1 BLUE=1 TRANSMIT=0
    SET_LED LED=toolhead_leds INDEX=2 RED=1 GREEN=1 BLUE=1 TRANSMIT=0
    SET_LED LED=toolhead_leds INDEX=3 RED=0.15 GREEN=0.15 BLUE=0.15 TRANSMIT=1

[gcode_macro TOOLHEAD_LEDS_OFF]
description: Turn all toolhead LEDs off
gcode:
    SET_LED LED=toolhead_leds RED=0 GREEN=0 BLUE=0

[gcode_macro TOOLHEAD_LEDS_DIM]
description: Set toolhead LEDs dim
gcode:
    SET_LED LED=toolhead_leds INDEX=1 RED=0.05 GREEN=0.05 BLUE=0.05 TRANSMIT=0
    SET_LED LED=toolhead_leds INDEX=2 RED=0.05 GREEN=0.05 BLUE=0.05 TRANSMIT=0
    SET_LED LED=toolhead_leds INDEX=3 RED=0.05 GREEN=0.05 BLUE=0.05 TRANSMIT=1

[gcode_macro TOOLHEAD_LOGO_OFF]
description: Turn off only toolhead LED 3
gcode:
    SET_LED LED=toolhead_leds INDEX=3 RED=0 GREEN=0 BLUE=0

[gcode_macro TOOLHEAD_LOGO_ON]
description: Turn off only toolhead LED 3
gcode:
    SET_LED LED=toolhead_leds INDEX=3 RED=0.15 GREEN=0.15 BLUE=0.15

[gcode_macro TOOLHEAD_LOGO_DIM]
description: Turn off only toolhead LED 3
gcode:
    SET_LED LED=toolhead_leds INDEX=3 RED=0.05 GREEN=0.05 BLUE=0.05

[gcode_macro TEST_SPEED]
# Home, get position, throw around toolhead, home again.
# If MCU stepper positions (first line in GET_POSITION) are greater than a full step different (your number of microsteps), then skipping occured.
# We only measure to a full step to accomodate for endstop variance.
# Example: TEST_SPEED SPEED=300 ACCEL=5000 ITERATIONS=10

description: Test for max speed and acceleration parameters for the printer. Procedure: Home -> ReadPositionFromMCU -> MovesToolhead@Vel&Accel -> Home -> ReadPositionfromMCU

gcode:
    # Speed
    {% set speed  = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|int %}
    # Iterations
    {% set iterations = params.ITERATIONS|default(5)|int %}
    # Acceleration
    {% set accel  = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}
    # Minimum Cruise Ratio
    {% set min_cruise_ratio = params.MIN_CRUISE_RATIO|default(0.5)|float %}
    # Bounding inset for large pattern (helps prevent slamming the toolhead into the sides after small skips, and helps to account for machines with imperfectly set dimensions)
    {% set bound = params.BOUND|default(20)|int %}
    # Size for small pattern box
    {% set smallpatternsize = SMALLPATTERNSIZE|default(20)|int %}
    
    # Large pattern
        # Max positions, inset by BOUND
        {% set x_min = printer.toolhead.axis_minimum.x %}
        {% if x_min < 0 %}
            {% set x_min = 0 %}
        {% endif %}
    
        {% set y_min = printer.toolhead.axis_minimum.y %}
        {% if y_min < 0 %}
            {% set y_min = 0 %}
        {% endif %}
    
        {% set x_min = x_min + bound %}
        {% set x_max = printer.toolhead.axis_maximum.x - bound %}
        {% set y_min = y_min + bound %}
        {% set y_max = printer.toolhead.axis_maximum.y - bound %}
    
    # Small pattern at center
        # Find X/Y center point
        {% set x_center = (printer.toolhead.axis_minimum.x|float + printer.toolhead.axis_maximum.x|float ) / 2 %}
        {% set y_center = (printer.toolhead.axis_minimum.y|float + printer.toolhead.axis_maximum.y|float ) / 2 %}
        
        # Set small pattern box around center point
        {% set x_center_min = x_center - (smallpatternsize/2) %}
        {% set x_center_max = x_center + (smallpatternsize/2) %}
        {% set y_center_min = y_center - (smallpatternsize/2) %}
        {% set y_center_max = y_center + (smallpatternsize/2) %}

    # Save current gcode state (absolute/relative, etc)
    SAVE_GCODE_STATE NAME=TEST_SPEED
    
    # Output parameters to g-code terminal
    { action_respond_info("TEST_SPEED: starting %d iterations at speed %d, accel %d" % (iterations, speed, accel)) }
    
    # Home and get position for comparison later:
        M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
        G28
        # QGL if not already QGLd (only if QGL section exists in config)
        {% if printer.configfile.settings.quad_gantry_level %}
            {% if printer.quad_gantry_level.applied == False %}
                QUAD_GANTRY_LEVEL
                G28 Z
            {% endif %}
        {% endif %} 
        # Move 50mm away from max position and home again (to help with hall effect endstop accuracy - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/24)
        G90
        G1 X{printer.toolhead.axis_maximum.x-50} Y{printer.toolhead.axis_maximum.y-50} F{30*60}
        M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
        G28 X Y
        G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
        G4 P1000 
        GET_POSITION

    # Go to starting position
    G0 X{x_min} Y{y_min} Z{bound + 10} F{speed*60}

    # Set new limits
    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} MINIMUM_CRUISE_RATIO={min_cruise_ratio}
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} ACCEL_TO_DECEL={accel / 2}
    {% endif %}

    {% for i in range(iterations) %}
        # Large pattern diagonals
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
        
        # Large pattern box
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
    
        # Small pattern diagonals
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_max} Y{y_center_max} F{speed*60}
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
        G0 X{x_center_min} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
        
        # Small pattern box
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_min} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
    {% endfor %}

    # Restore max speed/accel/accel_to_decel to their configured values
    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} MINIMUM_CRUISE_RATIO={printer.configfile.settings.printer.minimum_cruise_ratio} 
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} ACCEL_TO_DECEL={printer.configfile.settings.printer.max_accel_to_decel}
    {% endif %}

    # Re-home and get position again for comparison:
        M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
        G28 # This is a full G28 to fix an issue with CoreXZ - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/12
        # Go to XY home positions (in case your homing override leaves it elsewhere)
        G90
        G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
        G4 P1000 
        GET_POSITION

    # Restore previous gcode state (absolute/relative, etc)
    RESTORE_GCODE_STATE NAME=TEST_SPEED

[gcode_macro ENSURE_HOMED]
description: Home the printer if needed, but never home during printing or pause

gcode:
    {% set homed = printer.toolhead.homed_axes %}
    {% set state = printer.print_stats.state|lower %}

    {% if "xyz" in homed %}

        # Already fully homed. Nothing to do.

    {% elif state in ["standby", "complete", "cancelled", "error"] %}

        M117 Homing printer
        RESPOND TYPE=echo MSG="Printer not homed - homing now"
        G28

    {% else %}

        RESPOND TYPE=error MSG="Cannot home automatically while printer is {state}"
        M117 Homing not allowed
        { action_raise_error("ENSURE_HOMED: Printer is not fully homed and cannot safely home while " ~ state) }

    {% endif %}


[gcode_macro CLEAN_NOZZLE]
description: Safely clean nozzle, optionally park, and optionally restore temperature

variable_clean_temp: 180
variable_wipes: 8
variable_z_hop: 10
variable_brush_start_x: 218.5
variable_brush_end_x: 248.5
variable_brush_y: 312
variable_park_x: 206.5
variable_park_y: 312

gcode:
    ENSURE_HOMED

    {% set restore_temp = params.RESTORE_TEMP|default(1)|int %}
    {% set park = params.PARK|default(1)|int %}
    {% set clean = params.CLEAN|default(1)|int %}

    {% set original_target = printer.extruder.target|float %}
    {% set clean_temp = printer["gcode_macro CLEAN_NOZZLE"].clean_temp|float %}
    {% set current_z = printer.toolhead.position.z|float %}
    {% set z_max = printer.toolhead.axis_maximum.z|float %}
    {% set requested_hop = printer["gcode_macro CLEAN_NOZZLE"].z_hop|float %}
    {% set hop = [requested_hop, z_max - current_z]|min %}

    # Only heat if cleaning was requested
    {% if clean %}
        {% if printer.extruder.temperature < clean_temp %}
            M109 S{clean_temp}
        {% endif %}
    {% endif %}

    G90

    # Raise nozzle for clearance
    {% if hop > 0 %}
        G91
        G1 Z{hop} F3000
        G90
    {% endif %}

    {% if clean %}
        M117 Cleaning nozzle

        G1 X{printer["gcode_macro CLEAN_NOZZLE"].brush_start_x} Y{printer["gcode_macro CLEAN_NOZZLE"].brush_y} F18000

        {% for _ in range(printer["gcode_macro CLEAN_NOZZLE"].wipes|int) %}
            G1 X{printer["gcode_macro CLEAN_NOZZLE"].brush_end_x} F12000
            G1 X{printer["gcode_macro CLEAN_NOZZLE"].brush_start_x} F12000
        {% endfor %}
    {% endif %}

    # Restore previous nozzle target if requested
    {% if restore_temp %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={original_target}
    {% endif %}

    # Park if requested
    {% if park %}
        G1 X{printer["gcode_macro CLEAN_NOZZLE"].park_x} Y{printer["gcode_macro CLEAN_NOZZLE"].park_y} F18000
    {% endif %}



[gcode_macro PARK_NOZZLE]
description: Safely park nozzle without cleaning

variable_park_temp: 150

gcode:
    ENSURE_HOMED

    {% set set_temp = params.SET_TEMP|default(1)|int %}
    {% set park_temp = params.PARK_TEMP|default(printer["gcode_macro PARK_NOZZLE"].park_temp)|int %}

    {% set park_x = printer["gcode_macro CLEAN_NOZZLE"].park_x|float %}
    {% set park_y = printer["gcode_macro CLEAN_NOZZLE"].park_y|float %}

    G90
    G1 X{park_x} Y{park_y} F18000

    {% if set_temp %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={park_temp}
    {% endif %}


[gcode_macro LOAD_FILAMENT]
description: Home if safely needed, then load filament and purge

variable_load_temp: 245
variable_min_temp: 180
variable_load_length: 80
variable_purge_length: 35
variable_slow_load_length: 20

gcode:
    # Make sure printer is homed before starting
    ENSURE_HOMED

    {% set temp = params.TEMP|default(printer["gcode_macro LOAD_FILAMENT"].load_temp)|float %}
    {% set min_temp = params.MIN_TEMP|default(printer["gcode_macro LOAD_FILAMENT"].min_temp)|float %}
    {% set load = params.LOAD|default(printer["gcode_macro LOAD_FILAMENT"].load_length)|float %}
    {% set purge = params.PURGE|default(printer["gcode_macro LOAD_FILAMENT"].purge_length)|float %}
    {% set slow = params.SLOW|default(printer["gcode_macro LOAD_FILAMENT"].slow_load_length)|float %}

    {% if temp < min_temp %}

        RESPOND TYPE=error MSG="LOAD_FILAMENT cancelled: requested temp {temp}C is below minimum {min_temp}C"

    {% else %}

        SAVE_GCODE_STATE NAME=LOAD_FILAMENT_STATE

        M117 Heating for filament load
        RESPOND TYPE=echo MSG="Heating hotend to {temp}C for filament load"
        M109 S{temp}

        M83

        RESPOND TYPE=echo MSG="Loading filament"
        G1 E{load} F900

        RESPOND TYPE=echo MSG="Slow loading into hotend"
        G1 E{slow} F240

        RESPOND TYPE=echo MSG="Purging filament"
        G1 E{purge} F180

        G1 E-0.8 F1800

        M400

        PARK_NOZZLE SET_TEMP=0

        M117 Filament loaded
        RESPOND TYPE=echo MSG="Filament loaded"

        RESTORE_GCODE_STATE NAME=LOAD_FILAMENT_STATE

    {% endif %}


[gcode_macro UNLOAD_FILAMENT]
description: Home if safely needed, then unload filament

variable_unload_temp: 245
variable_min_temp: 180
variable_tip_distance: 12
variable_unload_length: 90

gcode:
    # Make sure printer is homed before starting
    ENSURE_HOMED

    {% set temp = params.TEMP|default(printer["gcode_macro UNLOAD_FILAMENT"].unload_temp)|float %}
    {% set min_temp = params.MIN_TEMP|default(printer["gcode_macro UNLOAD_FILAMENT"].min_temp)|float %}
    {% set tip = params.TIP|default(printer["gcode_macro UNLOAD_FILAMENT"].tip_distance)|float %}
    {% set unload = params.UNLOAD|default(printer["gcode_macro UNLOAD_FILAMENT"].unload_length)|float %}

    {% if temp < min_temp %}

        RESPOND TYPE=error MSG="UNLOAD_FILAMENT cancelled: requested temp {temp}C is below minimum {min_temp}C"

    {% else %}

        SAVE_GCODE_STATE NAME=UNLOAD_FILAMENT_STATE

        M117 Heating for filament unload
        RESPOND TYPE=echo MSG="Heating hotend to {temp}C for filament unload"
        M109 S{temp}

        M83

        RESPOND TYPE=echo MSG="Forming filament tip"
        G1 E5 F180
        G1 E-2 F1800
        G1 E{tip} F180
        G1 E-6 F1800

        RESPOND TYPE=echo MSG="Unloading filament"
        G1 E-{unload} F1800

        M400

        PARK_NOZZLE SET_TEMP=0

        M117 Filament unloaded
        RESPOND TYPE=echo MSG="Filament unloaded"

        RESTORE_GCODE_STATE NAME=UNLOAD_FILAMENT_STATE

    {% endif %}


[gcode_macro CHAMBER_FAN_CONTROL]
description: Control bed circulation fan based on chamber target

variable_chamber_target: 0
variable_hot_speed: 1.0
variable_hold_speed: 0.25
variable_deadband: 2.0

gcode:
    {% set TARGET = params.TARGET|default(0)|float %}
    {% set HOT_SPEED = params.HOT_SPEED|default(1.0)|float %}
    {% set HOLD_SPEED = params.HOLD_SPEED|default(0.25)|float %}
    {% set DEADBAND = params.DEADBAND|default(2.0)|float %}

    SET_GCODE_VARIABLE MACRO=CHAMBER_FAN_CONTROL VARIABLE=chamber_target VALUE={TARGET}
    SET_GCODE_VARIABLE MACRO=CHAMBER_FAN_CONTROL VARIABLE=hot_speed VALUE={HOT_SPEED}
    SET_GCODE_VARIABLE MACRO=CHAMBER_FAN_CONTROL VARIABLE=hold_speed VALUE={HOLD_SPEED}
    SET_GCODE_VARIABLE MACRO=CHAMBER_FAN_CONTROL VARIABLE=deadband VALUE={DEADBAND}

    {% if TARGET > 0 %}
        SET_FAN_SPEED FAN=bed_circulation SPEED={HOT_SPEED}
        UPDATE_DELAYED_GCODE ID=CHAMBER_FAN_LOOP DURATION=5
    {% else %}
        SET_FAN_SPEED FAN=bed_circulation SPEED=0
        UPDATE_DELAYED_GCODE ID=CHAMBER_FAN_LOOP DURATION=0
    {% endif %}


[delayed_gcode CHAMBER_FAN_LOOP]
gcode:
    {% set TARGET = printer["gcode_macro CHAMBER_FAN_CONTROL"].chamber_target|float %}
    {% set HOT_SPEED = printer["gcode_macro CHAMBER_FAN_CONTROL"].hot_speed|float %}
    {% set HOLD_SPEED = printer["gcode_macro CHAMBER_FAN_CONTROL"].hold_speed|float %}
    {% set DEADBAND = printer["gcode_macro CHAMBER_FAN_CONTROL"].deadband|float %}
    {% set CHAMBER = printer["temperature_sensor chamber"].temperature|float %}

    {% if TARGET > 0 %}

        {% if CHAMBER < (TARGET - DEADBAND) %}
            SET_FAN_SPEED FAN=bed_circulation SPEED={HOT_SPEED}
        {% else %}
            SET_FAN_SPEED FAN=bed_circulation SPEED={HOLD_SPEED}
        {% endif %}

        UPDATE_DELAYED_GCODE ID=CHAMBER_FAN_LOOP DURATION=10

    {% endif %}

[gcode_macro TOGGLE_CHAMBER_LIGHTS]
variable_state: 1
gcode:
    {% if printer["gcode_macro TOGGLE_CHAMBER_LIGHTS"].state|int %}
        SET_PIN PIN=chamber_lights VALUE=0
        SET_GCODE_VARIABLE MACRO=TOGGLE_CHAMBER_LIGHTS VARIABLE=state VALUE=0
    {% else %}
        SET_PIN PIN=chamber_lights VALUE=1
        SET_GCODE_VARIABLE MACRO=TOGGLE_CHAMBER_LIGHTS VARIABLE=state VALUE=1
    {% endif %}
    

[delayed_gcode CHAMBER_LIGHTS_INIT]
initial_duration: 1
gcode:
    SET_PIN PIN=chamber_lights VALUE=1
    SET_GCODE_VARIABLE MACRO=TOGGLE_CHAMBER_LIGHTS VARIABLE=state VALUE=1